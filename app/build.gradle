plugins {
    id 'com.android.application'
}

android {
    namespace 'com.taprec'
    compileSdk 34

    defaultConfig {
        applicationId 'com.taprec'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2'
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }
}
